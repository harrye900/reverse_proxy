name: Deploy Payment Service Only

on:
  workflow_dispatch:

jobs:
  deploy-payment:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Build and Publish Payment Service
      run: |
        dotnet restore ecommerce-app/microservices/payment-service/PaymentService.csproj
        dotnet build ecommerce-app/microservices/payment-service/PaymentService.csproj --configuration Release
        dotnet publish ecommerce-app/microservices/payment-service/PaymentService.csproj -c Release -o ./payment-publish
        ls -la ./payment-publish/
        echo "Contents of payment-publish:"
        find ./payment-publish -type f -name "*.dll" -o -name "*.exe" -o -name "*.json"
    
    - name: Deploy Payment Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: harry-ecommerce-payment
        package: ./payment-publish