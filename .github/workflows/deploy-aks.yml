name: Deploy to AKS

on:
  push:
    branches: [ deploytoaks-clean ]
  workflow_dispatch:

env:
  ACR_NAME: acrecommerce1809
  CLUSTER_NAME: aks-ecommerce-cluster
  RESOURCE_GROUP: rg-ecommerce-aks

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Login to ACR
      run: az acr login --name ${{ env.ACR_NAME }}
    
    - name: Build and push images
      run: |
        # Frontend
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/ecommerce-frontend:${{ github.sha }} ./ecommerce-app/frontend/
        docker push ${{ env.ACR_NAME }}.azurecr.io/ecommerce-frontend:${{ github.sha }}
        
        # Backend
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/ecommerce-backend:${{ github.sha }} ./ecommerce-app/backend/
        docker push ${{ env.ACR_NAME }}.azurecr.io/ecommerce-backend:${{ github.sha }}
        
        # Microservices
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/ecommerce-auth:${{ github.sha }} ./ecommerce-app/microservices/auth-service/
        docker push ${{ env.ACR_NAME }}.azurecr.io/ecommerce-auth:${{ github.sha }}
        
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/ecommerce-checkout:${{ github.sha }} ./ecommerce-app/microservices/checkout-service/
        docker push ${{ env.ACR_NAME }}.azurecr.io/ecommerce-checkout:${{ github.sha }}
        
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/ecommerce-payment:${{ github.sha }} ./ecommerce-app/microservices/payment-service/
        docker push ${{ env.ACR_NAME }}.azurecr.io/ecommerce-payment:${{ github.sha }}
    
    - name: Get AKS credentials
      run: az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CLUSTER_NAME }}
    
    - name: Deploy to AKS
      run: |
        helm upgrade --install ecommerce ./ecommerce-app/helm-chart/ecommerce/ \
          --namespace ecommerce \
          --create-namespace \
          --set frontend.image.tag=${{ github.sha }} \
          --set backend.image.tag=${{ github.sha }} \
          --set authService.image.tag=${{ github.sha }} \
          --set checkoutService.image.tag=${{ github.sha }} \
          --set paymentService.image.tag=${{ github.sha }}