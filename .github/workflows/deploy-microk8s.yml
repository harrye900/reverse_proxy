name: Build and Push to Docker Hub

on:
  push:
    branches: [ deploytomicrok8s ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}
    
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./ecommerce-app/frontend/
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/ecommerce-frontend:latest
          ${{ env.DOCKER_USERNAME }}/ecommerce-frontend:${{ github.sha }}
    
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./ecommerce-app/backend/
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/ecommerce-backend:latest
          ${{ env.DOCKER_USERNAME }}/ecommerce-backend:${{ github.sha }}
    
    - name: Build and push Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./ecommerce-app/microservices/auth-service/
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/ecommerce-auth:latest
          ${{ env.DOCKER_USERNAME }}/ecommerce-auth:${{ github.sha }}
    
    - name: Build and push Checkout Service
      uses: docker/build-push-action@v5
      with:
        context: ./ecommerce-app/microservices/checkout-service/
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/ecommerce-checkout:latest
          ${{ env.DOCKER_USERNAME }}/ecommerce-checkout:${{ github.sha }}
    
    - name: Build and push Payment Service
      uses: docker/build-push-action@v5
      with:
        context: ./ecommerce-app/microservices/payment-service/
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/ecommerce-payment:latest
          ${{ env.DOCKER_USERNAME }}/ecommerce-payment:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
    
    - name: Deploy to Kubernetes
      run: |
        # Create namespace if it doesn't exist
        kubectl create namespace ecommerce --dry-run=client -o yaml | kubectl apply -f -
        
        # Deploy using Helm
        helm upgrade --install ecommerce ./ecommerce-app/helm-chart/ecommerce \
          --namespace ecommerce \
          --set frontend.image.tag=latest \
          --set backend.image.tag=latest \
          --set authService.image.tag=latest \
          --set checkoutService.image.tag=latest \
          --set paymentService.image.tag=latest \
          --wait --timeout=10m
        
        # Show deployment status
        kubectl get pods -n ecommerce
        kubectl get services -n ecommerce