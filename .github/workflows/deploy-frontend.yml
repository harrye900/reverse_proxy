name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [ deploytoappservce ]
    paths: [ 'ecommerce-app/frontend/**' ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ecommerce-app/frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: ecommerce-app/frontend
    
    - name: Build
      run: npm run build
      working-directory: ecommerce-app/frontend
      env:
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
    
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
        publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
        package: ecommerce-app/frontend/build