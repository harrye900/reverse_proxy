name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [ deploytoappservce ]
    paths: [ 'ecommerce-app/frontend/**' ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Install and Build
      run: |
        npm install
        chmod +x node_modules/.bin/*
        npm run build
        ls -la build/
      working-directory: ecommerce-app/frontend
      env:
        REACT_APP_API_URL: https://harry-ecommerce-backend.azurewebsites.net
    
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: harry-ecommerce-frontend
        package: ecommerce-app/frontend