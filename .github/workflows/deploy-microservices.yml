name: Deploy Microservices to Azure App Service

on:
  push:
    branches: [ deploytoappservce ]
    paths: [ 'ecommerce-app/microservices/**' ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Build and Publish All Microservices
      run: |
        # Build Auth Service
        dotnet restore ecommerce-app/microservices/auth-service/AuthService.csproj
        dotnet publish ecommerce-app/microservices/auth-service/AuthService.csproj -c Release -o ./microservices-publish/auth
        
        # Build Checkout Service
        dotnet restore ecommerce-app/microservices/checkout-service/CheckoutService.csproj
        dotnet publish ecommerce-app/microservices/checkout-service/CheckoutService.csproj -c Release -o ./microservices-publish/checkout
        
        # Build Payment Service
        dotnet restore ecommerce-app/microservices/payment-service/PaymentService.csproj
        dotnet publish ecommerce-app/microservices/payment-service/PaymentService.csproj -c Release -o ./microservices-publish/payment
    
    - name: Deploy All Microservices
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_MICROSERVICES_APP_NAME }}
        publish-profile: ${{ secrets.AZURE_MICROSERVICES_PUBLISH_PROFILE }}
        package: ./microservices-publish