name: Deploy Microservices to Azure App Service
# Trigger deployment

on:
  push:
    branches: [ deploytoappservce ]
    paths: [ 'ecommerce-app/microservices/**' ]
  workflow_dispatch:

jobs:
  deploy-auth-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Build and Publish Auth Service
      run: |
        dotnet restore ecommerce-app/microservices/auth-service/AuthService.csproj
        dotnet publish ecommerce-app/microservices/auth-service/AuthService.csproj -c Release -o ./auth-publish
        ls -la ./auth-publish/
    
    - name: Deploy Auth Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: harry-ecommerce-microservices
        package: ./auth-publish

  deploy-checkout-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Build and Publish Checkout Service
      run: |
        dotnet restore ecommerce-app/microservices/checkout-service/CheckoutService.csproj
        dotnet publish ecommerce-app/microservices/checkout-service/CheckoutService.csproj -c Release -o ./checkout-publish
        ls -la ./checkout-publish/
    
    - name: Deploy Checkout Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: harry-ecommerce-checkout
        package: ./checkout-publish

  deploy-payment-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Build and Publish Payment Service
      run: |
        dotnet restore ecommerce-app/microservices/payment-service/PaymentService.csproj
        dotnet publish ecommerce-app/microservices/payment-service/PaymentService.csproj -c Release -o ./payment-publish
        ls -la ./payment-publish/
    
    - name: Deploy Payment Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: harry-ecommerce-payment
        package: ./payment-publish