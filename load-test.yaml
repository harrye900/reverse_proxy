apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: ecommerce
spec:
  replicas: 5
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load-generator
        image: busybox
        command: ["/bin/sh"]
        args: ["-c", "while true; do for i in $(seq 1 100); do wget -q -O- http://4.206.185.226 & done; wait; done"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi