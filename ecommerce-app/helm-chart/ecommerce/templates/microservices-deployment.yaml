# Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.authService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.authService.name }}
spec:
  replicas: {{ .Values.authService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.authService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.authService.name }}
    spec:
      containers:
      - name: {{ .Values.authService.name }}
        image: {{ .Values.global.registry }}/{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag }}
        imagePullPolicy: {{ .Values.global.pullPolicy }}
        ports:
        - containerPort: {{ .Values.authService.service.targetPort }}
        env:
        - name: ASPNETCORE_URLS
          value: "http://0.0.0.0:{{ .Values.authService.service.targetPort }}"
        resources:
          requests:
            memory: {{ .Values.authService.resources.requests.memory }}
            cpu: {{ .Values.authService.resources.requests.cpu }}
          limits:
            memory: {{ .Values.authService.resources.limits.memory }}
            cpu: {{ .Values.authService.resources.limits.cpu }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.authService.name }}-service
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: {{ .Values.authService.name }}
  ports:
  - protocol: TCP
    port: {{ .Values.authService.service.port }}
    targetPort: {{ .Values.authService.service.targetPort }}
  type: {{ .Values.authService.service.type }}
---
